name: cluster2
cluster_type: aws-eks
environment_names:
  - prod
type: cluster
base_domains:
  - '*.example.com'
  - '*.production.example.com'
  - '*.cluster2-prod.production.example.com'
  - '*.example.cloud'
monitoring:
  kubecost_url: http://kubecost-cost-analyzer.kubecost.svc.cluster.local:9090
  loki_url: http://loki.loki.svc.cluster.local:3100
  prometheus_url: >-
    http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
workbench_config:
  notebook_config:
    base_domain: nb.cluster2-prod.production.example.com
  ssh_server_config:
    base_domain: ssh.cluster2-prod.production.example.com
    port: 80
supported_nodepools:
  - name: test-np
  - name: test-np2
default_registry_fqn: internal:registry:example-registry:docker-registry:internal-images
---
type: role-binding
name: cl-cluster2-admin-lf
subjects:
  - type: user
    name: alice@example.com
  - type: user
    name: bob@example.com
permissions:
  - resourceType: cluster
    resourceFqn: cluster2
    role: cluster-admin
---
type: role-binding
name: cl-cluster2-viewer-mq
subjects:
  - type: team
    name: developers
permissions:
  - resourceType: cluster
    resourceFqn: cluster2
    role: cluster-viewer
