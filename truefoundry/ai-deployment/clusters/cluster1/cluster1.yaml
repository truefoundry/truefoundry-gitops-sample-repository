name: cluster1
cluster_type: gcp-gke-standard
environment_names:
  - dev
  - prod
  - staging
type: cluster
base_domains:
  - '*.cluster1.dev.example.com'
  - '*.internal.cluster1.dev.example.com'
monitoring:
  loki_url: http://loki.monitoring.svc.cluster.local:3100
  prometheus_url: http://prometheus.monitoring.svc.cluster.local:9090
default_registry_fqn: registry:example:docker-registry:dev-images
workbench_config:
  ssh_server_config:
    base_domain: ssh.cluster1.dev.example.com
    port: 80
---
type: role-binding
name: cl-cluster1-admin-sh
subjects:
  - type: user
    name: alice@example.com
  - type: user
    name: dave@example.com
permissions:
  - resourceType: cluster
    resourceFqn: cluster1
    role: cluster-admin
---
type: role-binding
name: cl-cluster1-viewer-hm
subjects:
  - type: user
    name: bob@example.com
permissions:
  - resourceType: cluster
    resourceFqn: cluster1
    role: cluster-viewer
---
type: role-binding
name: cl-cluster1-member-nw
subjects:
  - type: user
    name: charlie@example.com
permissions:
  - resourceType: cluster
    resourceFqn: cluster1
    role: cluster-member
