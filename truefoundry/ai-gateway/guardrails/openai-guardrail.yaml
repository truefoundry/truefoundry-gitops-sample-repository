name: openai-guardrail
type: provider-account/guardrail-config-group
integrations:
  - name: openai-guardrail-integration
    type: integration/guardrail-config/openai-moderations
    config:
      model: omni-moderation-latest
    auth_data:
      type: api-key
      api_key: <API_KEY>
    operation: validate
    enforcing_strategy: enforce
---
type: role-binding
name: pa-openai-guardrail-manager-1i
subjects:
  - type: team
    name: everyone
permissions:
  - resourceType: provider-account
    resourceFqn: truefoundry:guardrail-config-group:openai-guardrail
    role: provider-account-manager
