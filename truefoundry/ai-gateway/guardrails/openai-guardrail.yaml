name: openai-guardrail
type: provider-account/guardrail-config-group
collaborators:
  - role_id: provider-account-manager
    subject: team:everyone
integrations:
  - name: openai-guardrail-integration
    type: integration/guardrail-config/openai-moderations
    config:
      model: omni-moderation-latest
    auth_data:
      type: api-key
      api_key: <API_KEY>
    operation: validate
    enforcing_strategy: enforce
