name: bedrock-guardrail
type: provider-account/guardrail-config-group
integrations:
  - name: bedrock
    type: integration/guardrail-config/aws-bedrock
    config:
      region: us-east-1
      guardrail_id: <GUARDRAIL_ID>
      guardrail_version: "1"
    auth_data:
      type: api-key
      api_key: <API_KEY>
    operation: validate
    description: AWS Bedrock Guardrails for content filtering and safety policies
    enforcing_strategy: enforce_but_ignore_on_error
---
type: role-binding
name: pa-bedrock-guardrail-manager-tm
subjects:
  - type: user
    name: <USER_EMAIL>
permissions:
  - resourceType: provider-account
    resourceFqn: truefoundry:guardrail-config-group:bedrock-guardrail
    role: provider-account-manager
---
type: role-binding
name: pa-bedrock-guardrail-access-j5
subjects:
  - type: team
    name: everyone
permissions:
  - resourceType: provider-account
    resourceFqn: truefoundry:guardrail-config-group:bedrock-guardrail
    role: provider-account-access
