name: azure-guardrail
type: provider-account/guardrail-config-group
integrations:
  - name: azure-guardrail
    type: integration/guardrail-config/azure-pii
    config:
      domain: phi
      language: en
      api_version: "2024-11-01"
      model_version: latest
      resource_name: <RESOURCE_NAME>
      pii_categories:
        - "*"
    priority: 1
    auth_data:
      type: api-key
      api_key: <API_KEY>
    operation: mutate
    description: Azure AI Language PII detection and redaction for sensitive data
    enforcing_strategy: enforce
---
type: role-binding
name: pa-azure-guardrail-manager-qa
subjects:
  - type: user
    name: <USER_EMAIL>
permissions:
  - resourceType: provider-account
    resourceFqn: truefoundry:guardrail-config-group:azure-guardrail
    role: provider-account-manager
---
type: role-binding
name: pa-azure-guardrail-access-d1
subjects:
  - type: team
    name: everyone
permissions:
  - resourceType: provider-account
    resourceFqn: truefoundry:guardrail-config-group:azure-guardrail
    role: provider-account-access
