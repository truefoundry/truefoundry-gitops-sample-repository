name: palo-alto-guardrail
type: provider-account/guardrail-config-group
integrations:
  - name: palo-alto
    type: integration/guardrail-config/palo-alto-prisma-airs
    config:
      mode: sync
      base_url: https://service-sg.api.aisecurity.paloaltonetworks.com/v1/
      profile_name: TF-Test-DG
    auth_data:
      type: api-key
      api_key: <API_KEY>
    operation: validate
    description: Palo Alto Prisma AIRS for AI security and content validation
    enforcing_strategy: enforce_but_ignore_on_error
---
type: role-binding
name: pa-palo-alto-guardrail-manager-xn
subjects:
  - type: user
    name: <USER_EMAIL>
permissions:
  - resourceType: provider-account
    resourceFqn: truefoundry:guardrail-config-group:palo-alto-guardrail
    role: provider-account-manager
---
type: role-binding
name: pa-palo-alto-guardrail-access-hx
subjects:
  - type: team
    name: everyone
permissions:
  - resourceType: provider-account
    resourceFqn: truefoundry:guardrail-config-group:palo-alto-guardrail
    role: provider-account-access
