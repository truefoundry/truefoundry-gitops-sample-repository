name: openai-model
type: provider-account/openai
auth_data:
  api_key: <API_KEY>
  type: api-key
integrations:
  - type: integration/model/openai
    name: gpt-5
    model_id: gpt-5
    model_types:
      - chat
    cost:
      metric: public_cost
---
type: role-binding
name: pa-openai-model-manager-4p
subjects:
  - type: team
    name: everyone
permissions:
  - resourceType: provider-account
    resourceFqn: truefoundry:openai:openai-model
    role: provider-account-manager
