name: virtual-mcp
type: mcp-server/virtual
description: Cloudflare docs and Notion tools behind one MCP server
servers:
  - name: cloudflare-docs-mcp
  - name: notion-mcp
---
type: role-binding
name: mcp-virtual-mcp-manager-mm
subjects:
  - type: team
    name: everyone
permissions:
  - resourceType: mcp-server
    resourceFqn: truefoundry:mcp-server:virtual-mcp
    role: mcp-server-manager
