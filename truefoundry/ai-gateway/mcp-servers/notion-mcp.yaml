url: https://mcp.notion.com/mcp
name: notion-mcp
type: mcp-server/remote
auth_data:
  type: oauth2
  grant_type: authorization_code
  provider: custom
  scopes: []
  token_url: https://mcp.notion.com/token
  jwt_source: access_token
  registration_url: https://mcp.notion.com/register
  authorization_url: https://mcp.notion.com/authorize
  code_challenge_methods_supported:
    - S256
description: Notion is a collaboration and productivity tool.
---
type: role-binding
name: mcp-notion-mcp-manager-4l
subjects:
  - type: user
    name: <USER_EMAIL>
permissions:
  - resourceType: mcp-server
    resourceFqn: truefoundry:mcp-server:notion-mcp
    role: mcp-server-manager
