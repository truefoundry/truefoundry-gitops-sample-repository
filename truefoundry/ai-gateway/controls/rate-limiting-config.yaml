name: rate-limiting-config
type: gateway-rate-limiting-config
rules:
  - id: qa-team
    unit: requests_per_hour
    when:
      models:
        - anthropic-model/claude-opus-4-1
      subjects:
        - user:bob@gmail.com
    limit_to: 10
  - id: plat-team
    unit: requests_per_day
    when:
      models:
        - gemini-model/gemini-3-flash-preview
        - gemini-model/gemma-3-27b-it
      metadata:
        key: value
      subjects:
        - user:vik@yahoo.com
    limit_to: 1
