name: routing-config
type: gateway-load-balancing-config
rules:
  - id: routeconfig
    type: priority-based-routing
    when:
      models:
        - openai-model/gpt-5
    load_balance_targets:
      - target: openai-model/gpt-5
        priority: 2
        sla_cutoff:
          time_per_output_token_ms: 30000
        timeout_ms: 30000
        retry_config:
          delay: 100
          attempts: 2
          on_status_codes:
            - '429'
            - '500'
            - '504'
        fallback_candidate: true
        fallback_status_codes:
          - '401'
          - '403'
          - '404'
          - '429'
          - '500'
          - '502'
          - '503'
          - '408'
          - '504'
      - target: anthropic-model/claude-opus-4-1
        priority: 2
        override_params:
          temperature: 0.7
        fallback_candidate: true
  - id: codex-cli
    type: weight-based-routing
    when:
      models:
        - gemini-model/gemini-3-flash-preview
    load_balance_targets:
      - target: gemini-model/gemma-3-27b-it
        weight: 100
        fallback_candidate: true
  - id: claude-sonnet
    type: weight-based-routing
    when:
      subjects:
        - user:bob@gmail.com
    load_balance_targets:
      - target: anthropic-model/claude-opus-4-1
        weight: 100
        fallback_candidate: true
