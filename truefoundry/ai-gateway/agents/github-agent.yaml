name: github-agent
type: agent/remote
description: Registers an externally hosted GitHub agent with the gateway
proxy_via_gateway:
  enabled: false
---
type: role-binding
name: agt-github-agent-access-nz
subjects:
  - type: team
    name: everyone
permissions:
  - resourceType: agent
    resourceFqn: truefoundry:agent:github-agent
    role: agent-access
